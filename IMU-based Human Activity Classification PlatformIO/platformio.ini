; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[project] 
name = imu-based-human-activity-classification

[env:nucleo_l476rg]
platform = ststm32
board = nucleo_l476rg
framework = stm32cube


monitor_speed = 115200
; Let PlatformIO auto-detect the USB port on macOS


build_flags =
    ; Core Project Path Includes Directories
    -I include
    -I src

    ; tells the compiler exactly where to find the TensorFlow Lite Micro library and its dependencies
    -I lib/tflm_tree
    -I lib/tflm_tree/third_party/flatbuffers/include
    -I lib/tflm_tree/third_party/gemmlowp
    -I lib/tflm_tree/third_party/ruy
    -I lib/tflm_tree/third_party/kissfft

    ; Exclude standard array allocation not available for cortex-m4
    -D TF_LITE_STATIC_MEMORY
    -D NUCLEO_L476RG

    ; Modern TFLM compilation requires the C++17 standard
    -std=c++17

    ; Force inclusion of floating-point support in serial prints
    -Wl,-u,_printf_float